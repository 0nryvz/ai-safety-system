spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/isg_db}
    username: ${SPRING_DATASOURCE_USERNAME:isg_user}
    password: ${SPRING_DATASOURCE_PASSWORD:isg_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

application:
  security:
    jwt:
      # Sunucudaki JWT_SECRET ortam değişkenini okur, bulamazsa default olarak verdiğimiz Hex anahtarı kullanır.
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 900000
      refresh-token:
        expiration: 604800000

    # --- YENİ EKLENEN KISIM (ADIM 5 GEREKSİNİMLERİ) ---
    camera:
      # Mobil uygulamaya verilecek kısa ömürlü oturum belirteci (token) için bağımsız imza anahtarı
      secret-key: ${CAMERA_SECRET_KEY:5A7134743777217A25432A462D4A614E645267556B58703273357638792F423F}
      expiration: 300000 # 5 dakika (300.000 ms) - Kısa ömürlü olması replay riskini azaltır

    internal:
      # Gateway ve AI Worker'ın /internal/v1/ endpointlerine erişirken kullanacağı servis anahtarı
      api-key: ${INTERNAL_API_KEY:dev-internal-service-key-12345}