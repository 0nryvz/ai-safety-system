services:
  postgres:
    image: postgres:16
    container_name: isg-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isg_db}
      POSTGRES_USER: ${POSTGRES_USER:-isg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isg_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-isg_user} -d ${POSTGRES_DB:-isg_db}
      interval: 5s
      timeout: 5s
      retries: 10


  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    container_name: isg-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio-data:/data


  minio-init:
    image: minio/mc:latest
    container_name: isg-minio-init

    depends_on:
      minio:
        condition: service_started

    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000
      $${MINIO_ROOT_USER}
      $${MINIO_ROOT_PASSWORD}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set none local/$${MINIO_BUCKET};
      echo 'MinIO bucket ready: '$${MINIO_BUCKET};
      "

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-violation-media}


volumes:
  postgres-data:
  minio-data: